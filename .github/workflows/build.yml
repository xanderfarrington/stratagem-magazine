name: Build Stratagem Magazine

on:
  workflow_dispatch:  # lets you click "Run"
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Run magazine generator
        run: python generate_magazine.py

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: stratagem-magazine
          path: output/stratagem_magazine.pdf
